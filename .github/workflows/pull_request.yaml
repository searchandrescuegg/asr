name: Pull Request

on:
  pull_request:

env:
  GH_CI_USER: kochava-ci
  GOPRIVATE: "github.com/Kochava"

jobs:
  commitlint:
    #
    # ensures commit messages follow conventional commits
    #
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v1
        with:
          node-version: 18
      - run: npm install --save-dev @commitlint/{config-conventional@v18.6.0,cli}
      - run: npx commitlint --from=${{ github.event.pull_request.base.sha }}
  lint:
    #
    # Lint the codebase using ruff
    #
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v2

  tests:
    #
    # Unit + contract + integration tests on CPU (no GPU/model markers).
    # Heavy tests (gpu_required, model_required, slo) are gated to GPU runners.
    #
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: uv sync from lockfile
        # Stable cu128 torch + PyPI-sourced NVIDIA wheels in the lock
        # are reliably fetchable, so the production sync flow works in
        # CI too. `--frozen` skips re-resolution.
        run: uv sync --frozen --group test
      - name: Run pytest (CPU, default markers)
        env:
          ASR_ALLOW_CPU: "1"
        run: uv run --no-sync pytest

  # NOTE: A `gpu-tests` job (real-model smoke, CUDA presence, SLO regression,
  # containerized E2E — Constitution IV layers 2/3/4 + Constitution VI) is
  # intentionally not present here. There is no GPU self-hosted runner
  # available yet; queueing the job would block PR completion forever.
  # See specs/001-multi-model-asr/tasks.md T053 for the wiring to add when
  # a runner exists.
