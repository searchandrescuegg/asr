[project]
name = "asr"
version = "0.2.0"
description = "Multi-model speech transcription server (NVIDIA Parakeet, Facebook Seamless)"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "gradio>=5.33.1",
    "librosa>=0.11.0",
    # NeMo + cuda-python are CUDA-only (Linux). On macOS the Parakeet
    # adapter's lazy `import nemo` raises and the model is marked FAILED
    # at startup; the rest of the app continues to serve.
    "nemo-toolkit[asr]>=2.4.0rc0; sys_platform == 'linux'",
    "cuda-python>=12.9.0; sys_platform == 'linux'",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-sdk>=1.27.0",
    "prometheus-client>=0.20.0",
    "pydantic-settings>=2.5.0",
    "pynvml>=11.5.0; sys_platform == 'linux'",
    "python-multipart>=0.0.20",
    "sentencepiece>=0.2.0",
    "soundfile>=0.12.1",
    "structlog>=24.4.0",
    # Linux: pinned cu128 nightly via tool.uv.sources below.
    # macOS: standard PyPI wheel (CPU/MPS).
    "torch>=2.9.0.dev20250701; sys_platform == 'linux'",
    "torch>=2.4; sys_platform == 'darwin'",
    "transformers>=4.45,<5.0",
    "uvicorn[standard]>=0.34.3",
]

[project.scripts]
asr = "asr.__main__:main"
dump-openapi = "asr.scripts.dump_openapi:main"

[dependency-groups]
dev = ["ruff>=0.11.13"]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "testcontainers>=4.8",
]

[tool.uv]
prerelease = "allow"
# `uv.lock` is the canonical Linux+CUDA resolution (the prod target).
# The cu128 nightly torch is regenerated infrequently because the
# upstream nightlies churn (see Makefile `make lock`).
# macOS contributors should NOT use `uv sync` — the lockfile pins
# Linux-only artefacts. Use `make install-mac` (or `pip install -e .`),
# which resolves from PyPI without the lockfile and pulls a CPU/MPS
# torch wheel.

[tool.uv.pip]
index-strategy = "unsafe-best-match"

# Linux installs torch from the pytorch nightly cu128 index; macOS falls
# through to PyPI for a standard CPU/MPS torch wheel.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/nightly/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not gpu_required and not model_required and not slo'"
markers = [
    "gpu_required: test requires a CUDA-capable GPU",
    "model_required: test requires real model weights to be downloadable / loadable",
    "slo: performance regression suite; runs against tests/perf/baseline.json",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

# FastAPI's idiomatic dependency-injection patterns (Depends/File/Form/Body
# in argument defaults) trip B008 by design. Globally suppress for the
# routes module rather than littering noqa comments at every parameter.
[tool.ruff.lint.per-file-ignores]
"src/asr/api/v1/routes.py" = ["B008"]
