[project]
name = "asr"
version = "0.2.0"
description = "Multi-model speech transcription server (NVIDIA Parakeet, Facebook Seamless)"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "cuda-python>=12.9.0",
    "fastapi[standard]>=0.115.12",
    "gradio>=5.33.1",
    "librosa>=0.11.0",
    "nemo-toolkit[asr]>=2.4.0rc0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-sdk>=1.27.0",
    "prometheus-client>=0.20.0",
    "pydantic-settings>=2.5.0",
    "pynvml>=11.5.0",
    "python-multipart>=0.0.20",
    "sentencepiece>=0.2.0",
    "soundfile>=0.12.1",
    "structlog>=24.4.0",
    "torch>=2.9.0.dev20250701",
    "transformers>=4.45,<5.0",
    "uvicorn[standard]>=0.34.3",
]

[project.scripts]
asr = "asr.__main__:main"
dump-openapi = "asr.scripts.dump_openapi:main"

[dependency-groups]
dev = ["ruff>=0.11.13"]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "testcontainers>=4.8",
]

[tool.uv]
prerelease = "allow"
extra-index-url = ["https://download.pytorch.org/whl/cu128"]

[tool.uv.pip]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/nightly/cu128"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not gpu_required and not model_required and not slo'"
markers = [
    "gpu_required: test requires a CUDA-capable GPU",
    "model_required: test requires real model weights to be downloadable / loadable",
    "slo: performance regression suite; runs against tests/perf/baseline.json",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

# FastAPI's idiomatic dependency-injection patterns (Depends/File/Form/Body
# in argument defaults) trip B008 by design. Globally suppress for the
# routes module rather than littering noqa comments at every parameter.
[tool.ruff.lint.per-file-ignores]
"src/asr/api/v1/routes.py" = ["B008"]
